<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteirinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="marca">Carteirinha Escolar</div>

  <div class="topbar-acoes">
    <button type="button" id="btnSalvar" class="botao botao-primario">Salvar Carteirinha</button>
    <button type="button" id="btnImprimir" class="botao">Imprimir</button>
    <button type="button" id="btnLimpar" class="botao botao-perigo">Limpar</button>

    <div class="config-wrap">
      <button type="button" id="btnConfig" class="botao" aria-haspopup="true" aria-expanded="false">
        Configurações
        <svg class="config-seta" width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="config-menu" id="configMenu">
        <input type="search" id="buscaSalvas" class="busca-salvas" placeholder="Buscar nome, RA, turma, mãe, pai...">

        <select id="filtroAutorizado" class="filtro-autorizado">
          <option value="todos">Todos os alunos</option>
          <option value="autorizado">Somente saída autorizada</option>
          <option value="nao-autorizado">Sem saída autorizada</option>
        </select>

        <div class="lista-salvas" id="listaSalvas"></div>
        <p class="lista-vazia" id="listaVazia" hidden>Nenhuma carteirinha encontrada</p>

        <div class="config-menu-acoes">
          <button type="button" id="btnExportarJson" class="botao">Exportar JSON</button>
          <button type="button" id="btnImportarJson" class="botao">Importar JSON</button>
          <button type="button" id="btnCarregar" class="botao" disabled>Carregar para editar</button>
          <button type="button" id="btnRemover" class="botao botao-perigo" disabled>Remover aluno salvo</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="app">

  <div class="painel">

    <div class="campo">
      <label for="foto">Foto</label>
      <input type="file" id="foto" accept="image/jpeg,image/jpg,image/png,image/webp,.jpg,.jpeg,.png,.webp">
    </div>

    <div class="campo zoom-campo" id="zoomCampo" hidden>
      <label for="zoom">Zoom</label>
      <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
    </div>

    <div class="campo">
      <label for="nome">Nome</label>
      <input type="text" id="nome" autocomplete="off">
    </div>

    <div class="campo">
      <label for="serieTurma">Série/Turma</label>
      <select id="serieTurma">
        <option value=""></option>
        <optgroup label="Educação Infantil I">
          <option value="Jardim II - Educação Infantil I">Jardim II</option>
          <option value="Pré Escola - Educação Infantil I">Pré Escola</option>
        </optgroup>
        <optgroup label="Ensino Fundamental I">
          <option value="1ºAno A - Ensino Fundamental I">1ºAno A</option>
          <option value="1ºAno B - Ensino Fundamental I">1ºAno B</option>
          <option value="2ºAno A - Ensino Fundamental I">2ºAno A</option>
          <option value="2ºAno B - Ensino Fundamental I">2ºAno B</option>
          <option value="3ºAno A - Ensino Fundamental I">3ºAno A</option>
          <option value="3ºAno B - Ensino Fundamental I">3ºAno B</option>
          <option value="4ºAno A - Ensino Fundamental I">4ºAno A</option>
          <option value="4ºAno B - Ensino Fundamental I">4ºAno B</option>
          <option value="5ºAno A - Ensino Fundamental I">5ºAno A</option>
          <option value="5ºAno B - Ensino Fundamental I">5ºAno B</option>
        </optgroup>
        <optgroup label="Ensino Fundamental II">
          <option value="6ºAno A - Ensino Fundamental II">6ºAno A</option>
          <option value="7ºAno A - Ensino Fundamental II">7ºAno A</option>
          <option value="8ºAno A - Ensino Fundamental II">8ºAno A</option>
          <option value="8ºAno B - Ensino Fundamental II">8ºAno B</option>
          <option value="9ºAno A - Ensino Fundamental II">9ºAno A</option>
        </optgroup>
        <optgroup label="Ensino Médio">
          <option value="1ºSérie - Ensino Médio">1ºSérie</option>
          <option value="2ºSérie - Ensino Médio">2ºSérie</option>
          <option value="3ºSérie - Ensino Médio">3ºSérie</option>
        </optgroup>
      </select>
    </div>

    <div class="campo">
      <label for="ra">RA</label>
      <input type="text" id="ra" maxlength="11" autocomplete="off">
    </div>

    <div class="campo">
      <label for="nascimento">Data de nascimento</label>
      <input type="date" id="nascimento">
    </div>

    <div class="campo">
      <label for="cpf">CPF</label>
      <input type="text" id="cpf" maxlength="14" autocomplete="off">
    </div>

    <div class="linha">
      <div class="campo">
        <label for="mae">Mãe</label>
        <input type="text" id="mae" autocomplete="off">
      </div>
      <div class="campo">
        <label for="pai">Pai</label>
        <input type="text" id="pai" autocomplete="off">
      </div>
    </div>

    <div class="campo autorizados-campo">
      <label for="autorizados">Autorizados</label>
      <input type="text" id="autorizados" autocomplete="off">
      <div class="autorizados-opcoes" id="autorizadosOpcoes" hidden>
        <button type="button" id="opcaoAutorizadoSozinho">Saida Autorizada</button>
      </div>
    </div>

  </div>

  <div class="preview">
    <div class="cartao" id="cartao">

      <div class="face frente">
        <div class="foto-area" id="fotoArea"></div>

        <div class="dados">
          <div class="campo-dado dado-nome">
            <span class="valor" id="outNome"></span>
          </div>
          <div class="campo-dado dado-ra">
            <span class="valor" id="outRa"></span>
          </div>
          <div class="campo-dado dado-nascimento">
            <span class="valor" id="outNascimento"></span>
          </div>
          <div class="campo-dado dado-cpf">
            <span class="valor" id="outCpf"></span>
          </div>
          <div class="campo-dado dado-turma">
            <span class="valor" id="outSerieTurma"></span>
          </div>
          <div class="campo-dado dado-mae">
            <span class="valor" id="outMae"></span>
          </div>
          <div class="campo-dado dado-pai">
            <span class="valor" id="outPai"></span>
          </div>
        </div>

        <div class="autorizados-area">
          <span class="valor" id="outAutorizados"></span>
        </div>
      </div>

      <div class="face verso"></div>

    </div>
  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<input type="file" id="importarJsonInput" accept=".json,application/json" hidden>

<script src="script.js"></script>
</body>
</html>
